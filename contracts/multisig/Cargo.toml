[package]
name = "multisig"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
