name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Contracts ──────────────────────────────────────────────────────────────
  contracts:
    name: Contracts (fmt / clippy / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all --target wasm32v1-none -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.0.0

      - name: Build WASM
        run: stellar contract build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (validate HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML exists
        run: test -f frontend/index.html

      - name: Check JS exists
        run: test -f frontend/js/app.js

      - name: Check CSS exists
        run: test -f frontend/css/styles.css
